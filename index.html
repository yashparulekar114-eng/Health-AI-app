<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087F8C">
<title>Kalji: a daily health check-in for your parent</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="notice" role="note" data-i18n="notice" data-html></div>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></span><h1>Kalji</h1><span class="deva">कळजी</span></div>
    <div class="lang" role="group" aria-label="Language"><button id="lang-en" type="button">English</button><button id="lang-hg" type="button">Hinglish</button><button id="lang-hi" type="button">हिन्दी</button></div>
  </header>

  <main>
  <section id="view-papa">
    <div class="hero small">
      <svg class="art" viewBox="0 0 140 110" aria-hidden="true"><circle cx="96" cy="52" r="46" fill="#fff" opacity=".10"/><circle cx="96" cy="52" r="30" fill="#fff" opacity=".12"/><path d="M96 78c-16-6-26-18-24-34 12 0 22 8 24 34z" fill="#DDF4EC"/><path d="M96 78c14-4 24-16 24-30-12 2-22 12-24 30z" fill="#DCEFFA"/><path d="M96 80V44" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M40 30a9 9 0 0 0-13 0l-1 1-1-1a9 9 0 0 0-13 13l14 14 14-14a9 9 0 0 0 0-13z" transform="translate(6 6)" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" opacity=".85"/></svg>
      <p class="hi" data-i18n="sub"></p>
      <p class="big" data-i18n="prompt"></p>
    </div>
    <div id="reply" aria-live="polite"></div>
    <div id="quick" class="tiles"></div>

    <div class="card composer">
      <label for="msg" class="lbl" data-i18n="prompt2"></label>
      <textarea id="msg" rows="3" data-i18n-ph="ph"></textarea>
      <div class="row">
        <button id="mic" type="button" class="mic" aria-label="Speak" data-i18n="mic"></button>
        <button id="send" type="button" class="send" data-i18n="send"></button>
      </div>
      <div class="chips" aria-label="Try an example"></div>
    </div>
    <div class="card recent"><div class="rh"><h3 data-i18n="recentH"></h3><button id="undo" class="undo" type="button" data-i18n="undo"></button></div><ul id="recent" class="plain"></ul></div>
  </section>

  <section id="view-me" hidden>
    <div class="hero">
      <p class="date" id="date"></p>
      <h2 class="hero-title"><span id="greet"></span> · <span data-i18n="today"></span></h2>
      <div class="ringrow">
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="52"/><circle id="ring-arc" class="fg" cx="60" cy="60" r="52" stroke-dasharray="0 327" transform="rotate(-90 60 60)"/></svg>
          <div class="ring-in"><b id="ring-num">0</b><span id="ring-sub"></span></div>
        </div>
        <div class="stats">
          <div class="stat"><span class="ic" data-icon="drop"></span><div><b id="st-water">0%</b><small data-i18n="hWater"></small></div></div>
          <div class="stat"><span class="ic" data-icon="walk"></span><div><b id="st-walk">0%</b><small data-i18n="hWalk"></small></div></div>
          <div class="stat"><span class="ic" data-icon="pill"></span><div><b id="st-med">-</b><small data-i18n="hMed"></small></div></div>
        </div>
      </div>
    </div>

    <div id="status" class="status" role="status"></div>
    <div class="card energy"><h3 data-i18n="energyH"></h3>
      <div class="e3"><div><b id="e-eaten">0</b><small data-i18n="eEaten"></small></div><div><b id="e-burn">0</b><small data-i18n="eBurned"></small></div><div><b id="e-net">0</b><small data-i18n="eNet"></small></div></div>
      <p class="muted" data-i18n="eNote"></p></div>
    <div class="card goals"><div class="rh"><h3 data-i18n="goalsH"></h3><button id="goal-edit" class="undo" type="button" data-i18n="goalsEdit"></button></div>
      <ul id="goal-list" class="goal-list"></ul>
      <form id="goal-form" hidden>
        <label>💧 <span data-i18n="gfWater"></span><input id="g-water" type="number" inputmode="numeric" min="500" max="4000" step="100"></label>
        <label>🚶 <span data-i18n="gfWalk"></span><input id="g-walk" type="number" inputmode="numeric" min="10" max="120" step="5"></label>
        <label>🔥 <span data-i18n="gfKcal"></span><input id="g-kcal" type="number" inputmode="numeric" min="1000" max="3000" step="50"></label>
        <p class="muted" data-i18n="gHint"></p>
        <div class="row"><button type="button" id="goal-cancel" class="ghost" data-i18n="goalsCancel"></button><button type="submit" class="send" data-i18n="goalsSave"></button></div>
      </form></div>
    <div class="card summary"><ul id="summary"></ul></div>
    <div class="card nudge" id="nudge"></div>

    <div class="card"><h3 data-i18n="hMeals"></h3><ul id="meals" class="plain"></ul><p id="kcal" class="muted"></p></div>
    <div class="grid">
      <div class="card"><h3 data-i18n="hWater"></h3><div class="bar"><i id="water-bar"></i></div><p id="water-txt" class="muted"></p></div>
      <div class="card"><h3 data-i18n="hWalk"></h3><div class="bar"><i id="walk-bar"></i></div><p id="walk-txt" class="muted"></p></div>
      <div class="card"><h3 data-i18n="hMed"></h3><p id="med-txt"></p></div>
      <div class="card"><h3 data-i18n="hFeel"></h3><p id="sym-txt"></p></div>
    </div>
    <div class="row small">
      <button id="sample" class="ghost" data-i18n="sample"></button>
      <button id="clear" class="ghost" data-i18n="clear"></button>
    </div>
  </section>

  <p id="mode" class="mode"></p>
  <footer><p data-i18n="foot" data-html></p></footer>
  </main>

  <nav class="tabbar" role="tablist">
    <button id="tab-papa" role="tab" aria-selected="true"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span data-i18n="tabPapa"></span></button>
    <button id="tab-me" role="tab" aria-selected="false"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><span data-i18n="tabMe"></span></button>
  </nav>
</div>
<script src="parser.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
